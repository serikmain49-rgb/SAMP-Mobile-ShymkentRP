name: Build Shymkent Android debug APK

on:
  push:
    branches: [codex/shymkent-starter]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.2.11394342' 'cmake;3.22.1'
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon
      - name: Diagnose native crash addresses
        run: |
          LIB="$(find app -type f -path '*/arm64-v8a/libsamp.so' -print | grep -E '/(obj|unstripped_native_libs)/' | head -1)"
          test -n "$LIB"
          "$ANDROID_HOME/ndk/26.2.11394342/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-addr2line" -Cfipe "$LIB" 0x1af9fc 0x14a7e0 0x1486c4 0x162454 0x12edd0
      - uses: actions/upload-artifact@v4
        with:
          name: shymkent-rp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
